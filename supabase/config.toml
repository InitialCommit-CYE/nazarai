# Minimal Supabase CLI configuration. `supabase start` fills in defaults for everything else.
project_id = "nazarai"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
# No end-user authentication in the competition MVP (out of scope per CLAUDE.md section 2.5).
enabled = true
